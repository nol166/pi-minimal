[project]
name = "pi-minimal"
version = "0.1.1"
description = "Start pi with only the extensions and skills you pick"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["pi", "coding-agent", "llm", "tui", "cli", "skills", "extensions"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/nol166/pi-minimal"
Issues = "https://github.com/nol166/pi-minimal/issues"

[project.scripts]
pi-minimal = "pi_minimal:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pi_minimal.py"]

[tool.hatch.build.targets.sdist]
include = ["pi_minimal.py", "tests/", "README.md", "LICENSE", "docs/", "assets/"]
